<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0..1&display=swap" />
    <title>aegis</title>
    <style>
       body { background-color: #131315; color: #e5e1e4; }
        .glass-panel {
            background-color: rgba(24, 24, 27, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid theme('colors.outline-variant');
        }
        .ai-glow {
            box-shadow: 0 0 15px rgba(49, 146, 252, 0.3);
            border-color: theme('colors.primary-container');
        }
        .critical-glow {
            box-shadow: 0 0 15px rgba(255, 180, 171, 0.2);
            border-color: theme('colors.error');
        }
        .ambient-shadow { box-shadow: 0px 4px 20px rgba(0,0,0,0.5); }
        
        /* Minimalist Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: theme('colors.surface-variant'); border-radius: theme('borderRadius.full'); }
        ::-webkit-scrollbar-thumb:hover { background: theme('colors.outline-variant'); }
    </style>
  </head>
<body class="font-body-md text-body-md antialiased  flex h-screen">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
